services:
  spotify-jam-bridge:
    build: .
    image: spotify-jam-bridge:latest
    container_name: spotify-jam-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jam-data:/data
    environment:
      DEVICE_NAME: ${DEVICE_NAME:-Jam Bridge}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      AUTO_START: ${AUTO_START:-false}
      USE_SHORT_LINK: ${USE_SHORT_LINK:-true}
      API_KEY: ${API_KEY:-}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_ENTITY: ${HA_ENTITY:-input_text.spotify_jam_link}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  jam-data:
